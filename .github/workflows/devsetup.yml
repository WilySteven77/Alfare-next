name: CI y despliegue AlfaRed

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Calidad, pruebas y build
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar ESLint
        run: npm run lint

      - name: Ejecutar pruebas Vitest y cobertura
        run: npm run test:coverage

      - name: Guardar cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-vitest
          path: coverage/
          if-no-files-found: warn

      - name: Construir aplicación
        run: npm run build

  deploy:
    name: Desplegar entorno dev
    needs: quality
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Ejecutar despliegue remoto por SSH
        uses: appleboy/ssh-action@v1.0.0
        env:
          ENV_FILE: .env.dev
          APP_ENV: dev
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          envs: ENV_FILE,APP_ENV
          script: |
            set -e

            cd /root/admin/home/projects/victor/Alfare-next

            git fetch origin
            git checkout ${{ secrets.DEV_BRANCH }}
            git pull origin ${{ secrets.DEV_BRANCH }}

            docker compose \
              --env-file "${ENV_FILE}" \
              up --build -d

            docker compose \
              --env-file "${ENV_FILE}" \
              ps
