name: Deploy por entorno

on:
  push: 
    branches:
      - dev
  workflow_dispatch:

jobs:
  deploy:
    name: run pull
    runs-on: ubuntu-latest
    steps:
      - name: Elegir archivo de entorno segun la rama
        shell: bash
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [ "$BRANCH" = "main" ]; then
            echo "ENV_FILE=.env.prod" >> "$GITHUB_ENV"
            echo "APP_ENV=prod" >> "$GITHUB_ENV"
          elif [ "$BRANCH" = "test" ]; then
            echo "ENV_FILE=.env.test" >> "$GITHUB_ENV"
            echo "APP_ENV=test" >> "$GITHUB_ENV"
          else
            echo "ENV_FILE=.env.dev" >> "$GITHUB_ENV"
            echo "APP_ENV=dev" >> "$GITHUB_ENV"
          fi
          echo "Rama $BRANCH -> archivo de entorno"
      - name: executing remote ssh commands using ssh
        uses: appleboy/ssh-action@v1.0.0
        env:
          ENV_FILE: ${{ env.ENV_FILE }}
          APP_ENV: ${{ env.APP_ENV }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          envs: ENV_FILE,APP_ENV
          script: |
            cd /root/admin/home/projects/victor/Alfare-next
            git fetch
            git checkout ${{ secrets.DEV_BRANCH }}
            git pull origin ${{ secrets.DEV_BRANCH }}
            docker compose --env-file "${ENV_FILE}" up --build -d
            exit
