name: CI y Despliegue AlfaRed Produccion

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Calidad, pruebas y build
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar ESLint
        run: npm run lint

      - name: Ejecutar pruebas Vitest y cobertura
        run: npm run test:coverage

      - name: Guardar cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-vitest
          path: coverage/
          if-no-files-found: warn

      - name: Construir aplicación
        run: npm run build

  deploy:
    name: Desplegar entorno produccion
    needs: quality
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Ejecutar despliegue remoto por SSH
        uses: appleboy/ssh-action@v1.0.0
        env:
          ENV_FILE: .env.prod
          APP_ENV: prod
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 30m
          envs: ENV_FILE,APP_ENV
          script: |
            set -e

            cd /root/projects/alfared_prod/Alfare-next-prod || cd /root/admin/home/projects/victor/Alfare-next-prod

            git fetch origin
            git checkout main
            git pull origin main

            docker compose \
              --env-file "${ENV_FILE}" \
              up --build -d

            docker compose \
              --env-file "${ENV_FILE}" \
              ps

            docker image prune -f
