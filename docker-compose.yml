services:
  alfared-database:
    image: postgres:16-alpine
    networks:
      - alfa-network
    env_file:
      - ./.env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - alfadata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  alfared-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      alfared-database:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - alfa-network
    env_file:
      - ./.env
    environment:
      DB_HOST: ${DB_HOST:-host.docker.internal}
      HOSTNAME: 0.0.0.0
      PORT: ${PUERTO_BACKEND_CONTENEDOR}

  alfared-frontend:
    build: ./frontend
    depends_on:
      - alfared-backend
    ports:
      - "${PUERTO_FRONTEND_HOST}:${PUERTO_FRONTEND_CONTENEDOR}"
    networks:
      - alfa-network

networks:
  alfa-network:

volumes:
  alfadata:
