name: alfared-${APP_ENV:-dev}

services:
  alfared-database:
    image: postgres:16-alpine
    networks:
      - alfa-network
    env_file:
      - ${ENV_FILE:-.env.dev}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - alfadata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  alfared-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      alfared-database:
        condition: service_healthy
    networks:
      - alfa-network
    env_file:
      - ${ENV_FILE:-.env.dev}
    environment:
      # CAMBIO AQUÍ: Reemplaza host.docker.internal por alfared-database
      DB_HOST: ${DB_HOST:-alfared-database} 
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      HOSTNAME: 0.0.0.0
      PORT: ${PUERTO_BACKEND_CONTENEDOR}
      NODE_ENV: ${NODE_ENV:-production}
      APP_URL: ${APP_URL}

  alfared-frontend:
    build: ./frontend
    depends_on:
      - alfared-backend
    ports:
      - "${PUERTO_FRONTEND_HOST=127.0.0.1:80}:${PUERTO_FRONTEND_CONTENEDOR}"
    networks:
      - alfa-network
    env_file:
      - ${ENV_FILE:-.env.dev}

networks:
  alfa-network:
    name: alfared-${APP_ENV:-dev}-net

volumes:
  alfadata:
    name: alfared-${APP_ENV:-dev}-data
