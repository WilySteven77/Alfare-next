name: alfared-${APP_ENV:-dev}

services:
  alfared-database:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - alfa-network
    env_file:
      - ${ENV_FILE:-.env.dev}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wiliam12345}
      POSTGRES_DB: ${POSTGRES_DB:-Alfared}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - alfadata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ./database/migrations:/migrations:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  alfared-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      alfared-database:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - alfa-network
    env_file:
      - ${ENV_FILE:-.env.dev}
    environment:
      DB_HOST: alfared-database
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-wiliam12345}
      DB_DATABASE: ${POSTGRES_DB:-Alfared}
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/alfared/health | grep -q 'success' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  alfared-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      alfared-backend:
        condition: service_healthy
    networks:
      - alfa-network
    ports:
      - "${PUERTO_FRONTEND_HOST:-8080}:80"

networks:
  alfa-network:
    name: alfared-${APP_ENV:-dev}-net

volumes:
  alfadata:
    name: alfared-${APP_ENV:-dev}-data